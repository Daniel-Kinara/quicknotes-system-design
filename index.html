<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes API Client</h1>
      <p>Talking to a real API with fetch.</p>
    </header>

    <main>
      <section>
        <h2>Server notes</h2>
        <button id="load-btn" type="button">Load notes</button>
        <p id="status"></p>
      </section>

      <section>
        <h2>Create a note</h2>
        <form id="note-form">
          <p>
            <label for="title-input">Title</label>
            <input type="text" id="title-input" placeholder="Note title" />
          </p>
          <p>
            <label for="body-input">Body (optional)</label>
            <textarea
              id="body-input"
              rows="4"
              placeholder="Note body"
            ></textarea>
          </p>
          <button type="submit" id="submit-btn">Add note</button>
        </form>
      </section>

      <section>
        <h2>Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </body>
</html>
